# Filled in from the live tailnet. Re-verify with `tailscale status` if a
# machine is ever rebuilt or re-imaged.
#
# Nodes, as they actually are (2026-10-18):
#
#   loki     100.98.210.60    aarch64  23.4G RAM  4 vCPU   Ubuntu 24.04
#   heimdall 100.96.165.104   x86_64    0.9G RAM  2 vCPU   Ubuntu 24.04  8G swap
#   thor     100.89.69.71     x86_64    0.9G RAM  2 vCPU   Ubuntu 24.04  8G swap
#
# loki is the only one with headroom, so it runs the router. It could also host
# a bridge if a third account ever appears.
#
# sudo on all three needs a password, so run with --ask-become-pass.
# SSH goes through Tailscale SSH, which is why ansible_user is "opc".

all:
  children:

    cc_bridge:
      # One Go account per host, so each egresses from its own IP.
      vars:
        ansible_user: opc
      hosts:
        heimdall:
          ansible_host: 100.96.165.104
        thor:
          ansible_host: 100.89.69.71

    cc_router:
      vars:
        ansible_user: opc
      hosts:
        loki:
          ansible_host: 100.98.210.60
