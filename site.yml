---
# Command Code pooled gateway — one playbook for the whole fleet.
#
#   ansible-playbook site.yml
#
# Per host it syncs the upstream source at a pinned tag, renders the env file
# from Ansible Vault, then builds and starts. Safe to re-run: nothing changes
# unless the pinned tag or the vault contents changed.
#
# The only thing you do by hand is move cc_bridge_tag in
# group_vars/all.yml, and only when you want a newer bridge.

- name: discover versions on the controller
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    # The Oracle hosts have no npm and no guarantee of git history, and these
    # two lookups describe the controller's view of upstream, not each VPS's.
    # A separate play rather than delegate_to inside the fleet play: a
    # delegated task is still skipped when its host is unreachable, so one
    # dead VPS would silently skip the version probe for the entire fleet.
    - name: read the published Command Code CLI version
      ansible.builtin.command: npm view command-code version
      register: cc_probe
      changed_when: false
      check_mode: false

    - name: list upstream bridge releases
      ansible.builtin.command:
        argv:
          - git
          - ls-remote
          - "--tags"
          - "--refs"
          - "--sort=-v:refname"
          - "{{ cc_bridge_repo }}"
      register: cc_remote_tags
      changed_when: false
      check_mode: false

    - name: record what upstream currently publishes
      ansible.builtin.set_fact:
        cc_cli_version: "{{ cc_probe.stdout | trim }}"
        # --sort=-v:refname is git's own version sort. A lexical sort would
        # rank v1.100.0 below v1.74.0.d, a bug waiting for two digits.
        cc_bridge_latest: "{{ cc_remote_tags.stdout_lines[0].split('refs/tags/') | last }}"

    - name: report when the pin is behind upstream
      ansible.builtin.debug:
        msg: >-
          Upstream bridge has released {{ cc_bridge_latest }};
          cc_bridge_tag is pinned to {{ cc_bridge_tag }}.
          Edit group_vars/all.yml to move. Not automatic on purpose.
      when: cc_bridge_tag != cc_bridge_latest

- name: command code bridge fleet
  hosts: all
  become: true
  gather_facts: true

  # Without this, vault_data is undefined and the env-render task fails. The
  # pre_task below checks for the file first so the error names the fix.
  vars_files:
    - vault.yml

  vars:
    cc_cli_version: "{{ hostvars['localhost']['cc_cli_version'] }}"
    cc_bridge_latest: "{{ hostvars['localhost']['cc_bridge_latest'] }}"

  pre_tasks:
    # delegate_to + run_once: the vault lives on the controller. Without the
    # delegation this stats a path on the VPS, finds nothing, and aborts every
    # run with the setup message.
    - name: check the vault exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vault.yml"
      register: cc_vault
      delegate_to: localhost
      become: false
      run_once: true

    - name: explain how to create the vault
      ansible.builtin.fail:
        msg: >-
          {{ playbook_dir }}/vault.yml not found. Create it once with
          "cp vault.yml.example vault.yml", fill it in, then
          "ansible-vault encrypt vault.yml".
      when: not cc_vault.stat.exists

  tasks:

    - name: fail early if a prerequisite is missing
      ansible.builtin.command: "{{ item }} --version"
      loop:
        - docker
        - git
      changed_when: false

    # Built as id=url pairs, which is the format COMMANDCODE_ROUTER_BACKENDS
    # expects. A plain Jinja loop rather than regex_replace: the backreference
    # escaping in a YAML block scalar does not survive the trip reliably, and a
    # literal \1 here would silently produce a router that reaches no backend.
    - name: build the router backend list from the cc_bridge group
      ansible.builtin.set_fact:
        cc_router_backends: "{% for h in groups['cc_bridge'] %}{{ h }}=http://{{ hostvars[h]['ansible_host'] }}:{{ cc_service_port }}{% if not loop.last %},{% endif %}{% endfor %}"

    - name: sync upstream source at the pinned tag
      ansible.builtin.git:
        repo: "{{ cc_bridge_repo }}"
        dest: "{{ cc_source_dir }}"
        version: "{{ cc_bridge_tag }}"
        force: true

    # The upstream checkout ships its own docker-compose.yml and .env.example.
    # Nothing here reads them, but `docker compose` in that directory would
    # pick the wrong file and the wrong env, so keep ours in its own tree.
    - name: create the service directory
      ansible.builtin.file:
        path: "{{ cc_service_dir }}/{{ cc_role }}"
        state: directory
        mode: "0755"

    - name: render the env file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/files/{{ cc_role }}.env.j2"
        dest: "{{ cc_service_dir }}/{{ cc_role }}/{{ cc_role }}.env"
        mode: "0600"
      no_log: true

    - name: render the compose file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/files/compose-{{ cc_role }}.yml.j2"
        dest: "{{ cc_service_dir }}/{{ cc_role }}/compose.yml"
        mode: "0644"

    # Async, not the docker_compose_v2 module, because the build stage runs the
    # project's full verify suite. On a 1GB/1-vCPU box that can outlast an SSH
    # timeout, and a synchronous module call would drop the connection mid-build.
    - name: build and start
      ansible.builtin.command: docker compose up -d --build --remove-orphans
      args:
        chdir: "{{ cc_service_dir }}/{{ cc_role }}"
      async: 5400
      poll: 15
      changed_when: true

    # docker_container_info needs the Docker Python SDK, which a fresh VPS does
    # not have. `docker inspect` is already present wherever the build ran.
    - name: inspect the container
      ansible.builtin.command:
        argv: [docker, inspect, "-f", "{{ '{{' }}.State.Running{{ '}}' }}", "cc-{{ cc_role }}"]
      register: cc_inspect
      changed_when: false
      failed_when: cc_inspect.rc not in [0, 1]

    - name: fail if the container is missing or not running
      ansible.builtin.fail:
        msg: >-
          cc-{{ cc_role }} is not running on {{ inventory_hostname }}.
          Read "docker compose logs" in {{ cc_service_dir }}/{{ cc_role }},
          or the dashboard at http://{{ ansible_host }}:{{ cc_service_port }}/dashboard/
          for a bridge, or /health for the router.
      when: cc_inspect.rc != 0 or 'true' not in cc_inspect.stdout
