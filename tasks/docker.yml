---
# Docker CE install. All three hosts are Ubuntu 24.04, so this is the apt path
# only; the dnf branch it used to carry was dead code.
#
# The presence check is guarded, so re-running is cheap and a second run is a
# no-op.

- name: check whether docker is already present
  ansible.builtin.command: docker --version
  register: cc_docker_present
  changed_when: false
  failed_when: false
  # Reading the version needs no privileges, so a check-mode run can report the
  # plan before you type a sudo password.
  become: false

- name: install docker
  when: cc_docker_present.rc != 0
  block:

    - name: install dependencies
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, git]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: add the docker gpg key
      ansible.builtin.shell: |
        set -eu
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: add the docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: install docker ce, compose and buildx
      ansible.builtin.package:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: ensure the docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: add the login user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user | default(cc_admin_user) }}"
        groups: docker
        append: true

    - name: enable and start docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

  rescue:
    - name: report the docker install failure
      ansible.builtin.fail:
        msg: >-
          Docker install failed on {{ inventory_hostname }}
          ({{ ansible_distribution }} {{ ansible_distribution_version }},
          {{ ansible_architecture }}). Check that the host can reach
          download.docker.com, and that apt is not locked by another run.
