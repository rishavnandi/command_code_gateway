# Upstream source. No fork: nothing this setup changes lives in the code.
# The CLI version pin lives in each host's env file, not in the image.
cc_bridge_repo: https://github.com/yelixir-dev/commandcode-bridge

# A release TAG, never "main". Pinning makes the build reproducible and makes
# rollback a one-line change. The playbook warns you when upstream moves past
# this, but deliberately does not follow it — a bridge release is code, and the
# cost of an unwanted one is higher than the cost of this reminder.
#   git ls-remote --tags --refs --sort=-v:refname \
#     https://github.com/yelixir-dev/commandcode-bridge | head
cc_bridge_tag: v1.74.0.d

cc_source_dir: /opt/commandcode-bridge
cc_service_dir: /opt/cc
cc_service_port: 9992

# Only used to add the login user to the docker group during install. The
# connecting user is preferred; this is the fallback when ansible_user is unset
# because the inventory relies on your ssh config.
cc_admin_user: "{{ lookup('env', 'USER') }}"

# The bridge enables only 6 of its bundled 85 models by default, and any other
# id gets a 400 ModelNotAllowedError. This extends that set rather than
# replacing it — verified against the bridge's own config loader, which also
# accepts ids missing from the 1.74 table. Keep it in sync with the models
# block in ~/.config/opencode/opencode.jsonc.
cc_allowed_models:
  - deepseek/deepseek-v4.1-flash

# cc_role is set per group, not here: see group_vars/cc_bridge.yml and
# group_vars/cc_router.yml. Setting it in all.yml and overriding it inline in
# the inventory does not work — the lower-precedence file silently wins.
